<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A9E4F7">
<meta name="mobile-web-app-capable" content="yes">
<title>The Wise Chess Cat — chess puzzles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Didact+Gothic&family=Rubik+Bubbles&display=swap" rel="stylesheet">
</head>
<body>
<div id="app"></div>
<script>
  /* VERSION — поднимать при каждом изменении файлов в src/: новый номер = новые адреса,
     и браузер не возьмёт старые скрипты из кеша. Порядок FILES важен. */
  const VERSION = '36';
  const FILES = [
    'styles.css',
    'config.js',
    'data/books.js',          // the shelf; it loads data/books/<id>.js itself
    'core/chess.js',
    'core/puzzle-source.js',
    'ui/texts.js',
    'i18n/en.js',
    'i18n/ru.js',
    'i18n/el.js',
    'ui/visuals.js',
    'ui/board.js',
    'game/puzzle-controller.js',
    'game/progress.js',
    'game/cloud.js',
    'app/app.js',
    'app/home.js',
    'app/volume.js',
    'app/play.js',
    'app/results.js',
    'app/history.js',
    'app/players.js',
    'app/main.js'
  ];
  for (const f of FILES) document.write(f.endsWith('.css')
    ? `<link rel="stylesheet" href="src/${f}?v=${VERSION}">`
    : `<script src="src/${f}?v=${VERSION}"><\/script>`);
</script>
<script>
  /* Self-update: re-read this index.html bypassing the cache and compare VERSION.
     If the server has a newer one, reload at a new address (?v=…) so the stale
     cached page is skipped. Checked on load and whenever the tab comes back to the
     foreground; never in the middle of a puzzle. One attempt per version (no loops). */
  (function () {
    function check() {
      if (location.protocol === 'file:') return;   // opened from disk: nothing to compare with
      fetch(location.pathname, { cache: 'no-store' }).then(r => (r.ok ? r.text() : '')).then(t => {
        const m = /const VERSION = '([^']+)'/.exec(t), fresh = m && m[1];
        if (!fresh || fresh === VERSION) return;
        if (window.App && App.debug && App.debug().screen === 'play') return;   // try again later
        try { if (sessionStorage.getItem('reloadedTo') === fresh) return; sessionStorage.setItem('reloadedTo', fresh); } catch (e) { /* ignore */ }
        const u = new URL(location.href); u.searchParams.set('v', fresh);
        location.replace(u.toString());
      }).catch(() => {});
    }
    window.addEventListener('load', check);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') check(); });
  })();
</script>
</body>
</html>
